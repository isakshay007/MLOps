name: Github Lab2 - Breast Cancer Retrain, Gate & Version

on:
  push:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab2/**'
      # The bot's own commits only touch these; don't let them count as a lab change
      - '!Labs/Github_Labs/Lab2/models/**'
      - '!Labs/Github_Labs/Lab2/metrics/**'
      - '.github/workflows/github_lab2_breast_cancer_retrain.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab2/**'
      - '.github/workflows/github_lab2_breast_cancer_retrain.yml'
  workflow_dispatch:

# Two runs pushing a new model version at the same time would conflict
concurrency:
  group: github-lab2-retrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab2

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: Labs/Github_Labs/Lab2/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest -v test

  retrain:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab2

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: Labs/Github_Labs/Lab2/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate model version
      run: echo "timestamp=$(date -u '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

    - name: Train model
      run: python src/train_model.py --timestamp "$timestamp"

    - name: Evaluate model on the test set
      run: python src/evaluate_model.py --timestamp "$timestamp"

    - name: Quality gate and register model
      run: python src/quality_gate.py --timestamp "$timestamp"

    - name: Upload model, metrics and MLflow run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: github-lab2-model-${{ env.timestamp }}
        path: |
          Labs/Github_Labs/Lab2/models/
          Labs/Github_Labs/Lab2/metrics/
          Labs/Github_Labs/Lab2/mlruns/
        if-no-files-found: ignore

    # Only versions that passed the gate reach this step; pull requests never commit
    - name: Commit and push the new model version
      if: github.event_name != 'pull_request'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
        git add models/ metrics/
        git commit -m "Github Lab2: register model version $timestamp"
        git pull --rebase
        git push
