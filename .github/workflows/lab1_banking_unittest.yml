name: Lab1 Banking - Unittests

on:
  push:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_banking_unittest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_banking_unittest.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab1

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: Labs/Github_Labs/Lab1/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run unittests
      # discover picks up every test/test_*.py, not just test_unittest.py
      run: python -m unittest discover -s test -t . -v

    - name: Notify on success
      if: success()
      run: echo "Unit tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Unit tests failed on Python ${{ matrix.python-version }}"
