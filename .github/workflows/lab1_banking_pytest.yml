name: Lab1 Banking - Pytest

on:
  push:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_banking_pytest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_banking_pytest.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab1

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: Labs/Github_Labs/Lab1/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests and generate XML report
      run: pytest -v --junitxml=pytest-report.xml
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-report-py${{ matrix.python-version }}
        path: Labs/Github_Labs/Lab1/pytest-report.xml

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

    - name: Notify on failure
      if: failure()
      run: echo "Tests failed on Python ${{ matrix.python-version }}"
